[package]
name = "app"
version = "1.0.0"
description = "Redis Visualizer desktop shell (Tauri)"
authors = ["redisviz"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# devtools:release 包启用 WebView 检查器(排障期保留;稳定后可移除,减体积+收紧面)
tauri = { version = "2.11.6", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"

# release 产物剥离调试符号:exe/dylib 体积降约 30-50%,bundle 打包/上传/分发全面受益,
# 对 Rust 编译时长几乎无影响。有意不加 lto/codegen-units:产物收益微小但显著增加 CI 编译时长。
[profile.release]
strip = true
