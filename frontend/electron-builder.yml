# electron-builder 打包配置
# 对应 docs/2026-10-20-electron-migration-evaluation.md §3.1 / §3.4。
#
# 资源布局（关键）：extraResources 默认落到 `process.resourcesPath`，
# 即 `<exe 目录>/resources/`（Windows/Linux）/ `<App>.app/Contents/Resources/`（macOS）。
# 故主进程按 `<resourcesPath>/app.jar` + `<resourcesPath>/runtime/bin/java` 探测 ——
# 便携版（解压 win-unpacked）与安装版共享同一布局。
appId: com.redisviz.frontend
productName: Redis Visualizer
copyright: Copyright © 2026 Redis Visualizer

directories:
  output: release
  # 图标目录：把 buildResources 直接指向 icons 目录，让三平台走「默认图标名自动发现」
  # （icon.ico / icon.icns / icon.png）。不写显式 icon 路径 —— 显式路径在不同版本里
  # 既有「相对项目根」也有「相对 buildResources」的解释，是 CI 静默失败的高发点。
  buildResources: assets/icons

# 渲染进程产物 + Node 侧产物；不放源码
# ⚠️ 排除 node_modules：renderer 的依赖已被 vite 打进 dist/，壳侧零 native 依赖，
#    electron-builder 默认会把 production dependencies 整棵拷进包（这里约 15MB 纯浪费）。
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!node_modules/**/*'

# asar + 高压缩：尽量压低安装包体积（§5.2）
asar: true
compression: maximum

# 由 CI 注入（app.jar + jlink runtime），不入库
extraResources:
  - from: resources/app.jar
    to: app.jar
  - from: resources/runtime
    to: runtime

artifactName: RedisVisualizer-${version}-${os}-${arch}.${ext}

win:
  target:
    - nsis
    - msi
  # 绿色版由 CI 直接打包 win-unpacked（portable 目标不支持 macOS/Linux，不用它）

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Redis Visualizer

# 注：MSI 目标没有 NSIS 那套 oneClick / allowToChangeInstallationDirectory 选项，
# 不要照搬（无效键只会产生 schema 告警，且误导后续维护者）。

mac:
  category: public.app-category.developer-tools
  # dmg（标准分发）+ zip（免安装版）；只出 arm64，与 jlink runtime 架构一致
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

linux:
  category: Development
  maintainer: redis-visualizer
  # AppImage（便携）/ deb / rpm（包管理器）/ zip（免安装版）
  target:
    - AppImage
    - deb
    - rpm
    - zip
