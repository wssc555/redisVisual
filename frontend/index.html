<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--
      内容安全策略（单一口径：随 index.html 走，dev 与打包态同一份）。
      迁移自 Tauri 的 app.security.csp，并剔除 Tauri v2 IPC 专用的
      `ipc:` / `http://ipc.localhost`（Electron 下无意义）；
      connect-src 除 'self'(= app://localhost) 外只放本地回环：sidecar 的
      `http://127.0.0.1:{port}/api` 与 vite HMR 的 ws。
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'self'"/>
    <title>Redis Visualizer</title>
    <style>
        /*
          启动画面(纯 CSS,零 JS 依赖):桌面模式下 Vue 挂载前要等 sidecar 握手
          (Spring Boot 启动 5–30s)。#app 为空时显示加载动画,Vue 挂载后 div 非空,
          :empty 选择器自动失效,无需任何手动清理。
        */
        #app:empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #app:empty::after {
            content: '';
            width: 36px;
            height: 36px;
            border: 3px solid #dcdfe6;
            border-top-color: #409eff;
            border-radius: 50%;
            animation: boot-spin 0.9s linear infinite;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
